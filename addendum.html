<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Addendum — Episoade YouTube | YESHUA</title>
<meta name="description" content="Toate episoadele video addendum la cartea YESHUA — Iisus Fără Creștinism." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold:        #C4922A;
    --gold-light:  #E8C87A;
    --gold-dark:   #8B6318;
    --cream:       #F5F0E8;
    --parchment:   #FAF7F2;
    --warm-dark:   #1C1208;
    --warm-brown:  #3D2B1A;
    --text-main:   #2C1E0F;
    --text-muted:  #6B5740;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'EB Garamond', Georgia, serif;
    background: var(--parchment);
    color: var(--text-main);
    line-height: 1.75;
  }

  /* ── Nav ──────────────────────────────────────── */
  nav {
    position: sticky;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 18px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(28, 18, 8, 0.96);
    box-shadow: 0 2px 24px rgba(0,0,0,0.35);
    backdrop-filter: blur(8px);
  }
  .nav-logo {
    font-family: 'Cinzel', serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--gold-light);
    letter-spacing: 0.12em;
    text-decoration: none;
  }
  .nav-back {
    font-family: 'Cinzel', serif;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.75);
    text-decoration: none;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  .nav-back:hover { color: var(--gold-light); }

  @media (max-width: 600px) {
    nav { padding: 16px 20px; }
  }

  /* ── Header ───────────────────────────────────── */
  .page-header {
    text-align: center;
    padding: 72px 24px 48px;
    background: linear-gradient(160deg, #0D0804 0%, #1C1208 50%, #0D0804 100%);
  }
  .section-label {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .section-label::before, .section-label::after {
    content: '';
    display: block;
    height: 1px;
    width: 48px;
    background: var(--gold);
    opacity: 0.5;
  }
  .page-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.9rem, 4.5vw, 3rem);
    font-weight: 700;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.25;
    margin-bottom: 18px;
  }
  .page-sub {
    max-width: 640px;
    margin: 0 auto;
    font-size: 1.1rem;
    font-style: italic;
    color: rgba(255,255,255,0.68);
  }

  /* ── Video grid ───────────────────────────────── */
  .video-section {
    padding: 64px 48px 96px;
  }
  .video-inner {
    max-width: 1400px;
    margin: 0 auto;
  }
  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 32px;
  }
  .video-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(196,146,42,0.3);
    box-shadow: 0 20px 60px rgba(0,0,0,0.18), 0 0 50px rgba(196,146,42,0.10);
    background: #000;
  }
  .video-frame iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .video-item-title {
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--warm-brown);
    text-align: center;
    margin-top: 14px;
    line-height: 1.4;
  }
  .video-unlisted-note {
    display: block;
    font-family: 'EB Garamond', serif;
    font-weight: 400;
    font-style: italic;
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
    font-style: italic;
    font-size: 1.05rem;
    border: 1px dashed rgba(196,146,42,0.35);
    border-radius: 8px;
    max-width: 640px;
    margin: 0 auto;
  }

  @media (max-width: 760px) {
    .video-section { padding: 48px 20px 72px; }
    .video-grid { grid-template-columns: 1fr; }
  }

  /* ── Footer ───────────────────────────────────── */
  footer {
    background: var(--warm-dark);
    text-align: center;
    padding: 32px 24px;
  }
  footer a {
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold-light);
    text-decoration: none;
  }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">YESHUA</a>
  <a href="/#video" class="nav-back">← Înapoi pe site</a>
</nav>

<header class="page-header">
  <div class="section-label">Addendum</div>
  <h1 class="page-title">Toate episoadele video</h1>
  <p class="page-sub">Colecția completă de episoade addendum la cartea YESHUA — Iisus Fără Creștinism.</p>
</header>

<section class="video-section">
  <div class="video-inner">
    <div class="video-grid" id="videoGrid">
      <!-- Episoadele se adaugă aici, câte un bloc pentru fiecare video:
      <div>
        <div class="video-frame">
          <iframe
            src="https://www.youtube-nocookie.com/embed/VIDEO_ID"
            title="Titlul episodului"
            loading="lazy"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen></iframe>
        </div>
        <p class="video-item-title">Titlul episodului</p>
      </div>
      -->
    </div>
    <div class="empty-state" id="emptyState">
      Episoadele vor fi adăugate aici în curând.
    </div>
  </div>
</section>

<footer>
  <a href="/">yeshuabook.com</a>
</footer>

</body>
</html>
